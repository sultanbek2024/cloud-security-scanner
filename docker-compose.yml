version: '3.8'

services:
  cloudsec-scanner:
    build: .
    container_name: cloudsec_scanner_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./report.html:/app/report.html
      - ./:/app/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
